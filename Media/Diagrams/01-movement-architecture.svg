<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1628"/>
      <stop offset="1" stop-color="#17263a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7dd3fc"/>
    </marker>
    <marker id="returnArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#a7f3d0"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <style>
      .title { font: 700 40px 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 21px 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #94a3b8; }
      .box-title { font: 700 25px 'SFMono-Regular', 'Apple SD Gothic Neo', monospace; fill: #f8fafc; }
      .body { font: 500 20px 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #cbd5e1; }
      .tag { font: 700 17px 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #082f49; }
      .arrow-label { font: 600 17px 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #bae6fd; }
      .return-label { font: 600 17px 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #a7f3d0; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1480" cy="80" r="180" fill="#0ea5e9" opacity="0.06"/>
  <circle cx="90" cy="850" r="230" fill="#34d399" opacity="0.05"/>

  <text x="72" y="70" class="title">01 이동 시스템 — 코드에서 화면 동작까지</text>
  <text x="72" y="108" class="subtitle">Unity 의존 실행 계층과 결정적 계산 계층을 분리한 2.5D 횡스크롤 이동 구조</text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="320" height="170" rx="22" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <rect x="92" y="210" width="114" height="31" rx="15" fill="#7dd3fc"/>
    <text x="111" y="232" class="tag">입력 계층</text>
    <text x="94" y="280" class="box-title">Input System</text>
    <text x="94" y="316" class="body">A / D · Space · Shift</text>
    <text x="94" y="345" class="body">키보드와 게임패드 입력 계약</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="515" width="320" height="180" rx="22" fill="#123c3a" stroke="#34d399" stroke-width="2"/>
    <rect x="92" y="535" width="114" height="31" rx="15" fill="#a7f3d0"/>
    <text x="111" y="557" class="tag">진행 상태</text>
    <text x="94" y="606" class="box-title">PlayerAbilityState</text>
    <text x="94" y="642" class="body">2단 점프 · 공중 대시</text>
    <text x="94" y="671" class="body">벽 이동 해금 ID 제공</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="500" y="265" width="410" height="340" rx="26" fill="#312e81" stroke="#a5b4fc" stroke-width="3"/>
    <rect x="526" y="288" width="190" height="33" rx="16" fill="#c7d2fe"/>
    <text x="545" y="311" class="tag">실행 오케스트레이터</text>
    <text x="526" y="365" class="box-title">SideScrollerMotor</text>
    <text x="526" y="411" class="body">• 입력 버퍼와 코요테 타이머</text>
    <text x="526" y="449" class="body">• 수평·수직 속도와 대시 상태</text>
    <text x="526" y="487" class="body">• 접지·벽 충돌 결과 확인</text>
    <text x="526" y="525" class="body">• CharacterController.Move 호출</text>
    <text x="526" y="563" class="body">• 확정 상태와 성공 이벤트 공개</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1030" y="165" width="490" height="190" rx="22" fill="#163047" stroke="#38bdf8" stroke-width="2"/>
    <rect x="1055" y="187" width="111" height="31" rx="15" fill="#7dd3fc"/>
    <text x="1075" y="209" class="tag">순수 계산</text>
    <text x="1055" y="258" class="box-title">MovementMath</text>
    <text x="1055" y="297" class="body">입력 정규화 · 바라보는 방향</text>
    <text x="1055" y="329" class="body">대시 방향 · 점프 초기 속도</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1030" y="405" width="490" height="190" rx="22" fill="#153b39" stroke="#34d399" stroke-width="2"/>
    <rect x="1055" y="427" width="111" height="31" rx="15" fill="#a7f3d0"/>
    <text x="1075" y="449" class="tag">순수 계산</text>
    <text x="1055" y="498" class="box-title">WallTraversalMath</text>
    <text x="1055" y="537" class="body">벽 법선 · 입력 방향 비교</text>
    <text x="1055" y="569" class="body">미끄러짐 제한 · 반발 속도</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="760" y="700" width="340" height="140" rx="22" fill="#3b2a16" stroke="#fbbf24" stroke-width="2"/>
    <text x="787" y="750" class="box-title">CharacterController</text>
    <text x="787" y="788" class="body">충돌을 반영한 실제 X/Y 이동</text>
    <text x="787" y="818" class="body">Z축은 고정</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1190" y="700" width="330" height="140" rx="22" fill="#3a1f3c" stroke="#f0abfc" stroke-width="2"/>
    <text x="1217" y="750" class="box-title">Animator / Feedback</text>
    <text x="1217" y="788" class="body">애니메이션 · Trail · 효과음</text>
    <text x="1217" y="818" class="body">확정된 상태만 표현</text>
  </g>

  <path d="M390 275 H465 Q485 275 500 305" fill="none" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="407" y="256" class="arrow-label">프레임 입력</text>
  <path d="M390 605 H460 Q480 605 500 565" fill="none" stroke="#a7f3d0" stroke-width="4" marker-end="url(#returnArrow)"/>
  <text x="407" y="636" class="return-label">사용 가능 여부</text>

  <path d="M910 335 C960 335 965 260 1030 260" fill="none" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1030 305 C970 305 965 380 910 380" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#returnArrow)"/>
  <text x="930" y="242" class="arrow-label">값 전달</text>
  <text x="932" y="408" class="return-label">계산 결과</text>

  <path d="M910 455 C965 455 970 500 1030 500" fill="none" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1030 545 C970 545 965 520 910 520" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#returnArrow)"/>

  <path d="M705 605 V650 Q705 675 760 740" fill="none" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="570" y="663" class="arrow-label">Move 실행</text>
  <path d="M820 605 C880 650 1120 640 1190 740" fill="none" stroke="#f0abfc" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1030" y="690" class="arrow-label">상태·이벤트</text>
</svg>
